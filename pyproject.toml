[project]
name = "observability-copilot"
version = "0.1.0"
description = "Consulta métricas do Prometheus, correlaciona com deploys recentes e resume em português o que está acontecendo."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "anthropic>=0.40",
    "openai>=1.40",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
obscopilot = "obscopilot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["obscopilot*"]
